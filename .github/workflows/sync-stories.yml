# Pulls published stories from Notion every night and redeploys when they changed.
# Run it by hand from the Actions tab ("Sync stories from Notion" → Run workflow)
# to publish a story straight away.
name: Sync stories from Notion

on:
  schedule:
    - cron: "0 9 * * *" # 04:00 Central (CDT), 03:00 in winter
  workflow_dispatch:

concurrency:
  group: sync-stories
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Sync stories
        run: npm run sync-stories
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_STORIES_DB_ID: ${{ secrets.NOTION_STORIES_DB_ID }}
      - name: Commit changes
        id: commit
        run: |
          git add src/data/posts.json public/story-images
          if git diff --cached --quiet; then
            echo "No story changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content(stories): sync from Notion"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
